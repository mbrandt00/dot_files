##### --- General Options ---
set -g default-terminal "tmux-256color"
set -g extended-keys on
set -g extended-keys-format csi-u
# Ghostty speaks extended keys, but tmux only asks for them when told the terminal can.
set -s terminal-features[10] "xterm-ghostty:extkeys"
# Without RGB, tmux squeezes 24-bit colors into the 256-color palette, which Ghostty
# derives from the light theme, so revdiff and other truecolor apps wash out.
set -s terminal-features[11] "xterm-ghostty:RGB"
set -g base-index 1
set -g renumber-windows on
set -g mouse on
# Let nvim and Claude Code see focus changes, and let Claude's notifications reach Ghostty
# from every window, not just the one on screen.
set -g focus-events on
set -g allow-passthrough all
set -g prefix C-a
unbind C-b
bind C-a send-prefix
set-window-option -g mode-keys vi

##### --- Split & Resize Panes ---
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z

##### --- Search Bindings ---
bind-key -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""
bind -T copy-mode-vi Escape send -X cancel

##### --- Session Switching ---
bind-key ( switch-client -p
bind-key ) switch-client -n

##### --- Lazygit Popup ---
unbind g
bind-key g popup -d "#{?@claude_worktree,#{@claude_worktree},#{pane_current_path}}" -xC -yC -w80% -h80% -E lazygit
bind-key C-g popup -d "#{?@claude_worktree,#{@claude_worktree},#{pane_current_path}}" -xC -yC -w80% -h80% -E lazygit

# prefix+v: revdiff floating over the pane, on the worktree the pane's Claude session is
# working in (@claude_worktree, set by the worktree-band mod), else the pane's directory.
# It reviews the whole diff; notes get pasted into the window's Claude input box.
bind-key v run-shell -b "~/.local/bin/revdiff-popup '#{pane_id}' '#{?@claude_worktree,#{@claude_worktree},#{pane_current_path}}' '#{client_name}'"
# prefix+V: the review queue (revdiff-queue, written by the revdiff-groups skill) as a group
# menu, then a verdict menu after each review. Quitting never accepts or skips a group.
bind-key V run-shell -b "~/.local/bin/revdiff-popup --queue '#{pane_id}' '#{?@claude_worktree,#{@claude_worktree},#{pane_current_path}}' '#{client_name}'"

# prefix+R: tuicr popup on the same directory as prefix+v; the branch's MR if one is open.
bind-key R popup -d "#{?@claude_worktree,#{@claude_worktree},#{pane_current_path}}" -xC -yC -w95% -h95% -E ~/.local/bin/tuicr-open

# prefix+e: flip between Claude and nvim in this window, splitting nvim open in the same directory
# as prefix+v when there is none. A zoomed window stays zoomed.
bind-key e run-shell "~/.config/tmux/editor-toggle.sh '#{pane_id}' '#{?@claude_worktree,#{@claude_worktree},#{pane_current_path}}'"

# prefix+W: new window (shell) in the same directory as prefix+v, named after it, placed
# right after the current window, for poking around the code Claude is working on.
bind-key W new-window -a -c "#{?@claude_worktree,#{@claude_worktree},#{pane_current_path}}" -n "#{?@claude_worktree,#{b:@claude_worktree},#{b:pane_current_path}}"


##### --- LazyDocker Popup ---
bind-key d detach-client
bind-key C-d popup -d "#{pane_current_path}" -xC -yC -w80% -h80% -E lazydocker

##### --- Pueue Queue Popup (live `pueue status`, q to close) ---
bind-key Q popup -xC -yC -w80% -h80% -E ~/.config/tmux/pueue-watch.sh

##### --- Dev Server Session ---
# prefix+S: switch to the "server" session, starting mise dev if absent (prefix+L goes back). From a
# blake-street checkout the server isn't running in, a menu offers go there / move the server here.
# server-start.sh runs mise sso first when the AWS token has expired.
bind-key S run-shell -b "~/.config/tmux/server-menu.sh '#{?@claude_worktree,#{@claude_worktree},#{pane_current_path}}' '#{client_name}'"

##### --- Rename every idle Claude tab (runs /rename in each) ---
bind-key N run-shell -b "~/.config/tmux/claude-rename-all.sh -m"

##### --- Reload Tmux Config ---
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

##### --- Plugin Setup ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'Morantron/tmux-fingers'

set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
# Homebrew owns the tmux-fingers binary; skip the plugin's rebuild wizard on version drift.
set -g @fingers-skip-wizard 1
# Hint whole command lines from Claude's replies (prefix+f, then the hint letter copies the line).
set -g @fingers-pattern-0 '! \S.*\S'
set -g @fingers-pattern-1 '(?:ssh|mise run|nix run|gh|\./[\w.-]+\.sh) \S.*\S'
# Ctrl+hint opens the match; URLs from panes under ~/work go to Brave's Work profile.
set -g @fingers-ctrl-action '/Users/michaelbrandt/.config/tmux/fingers-open.sh'
# Option+hint: a file opens in nvim in a new window (path:line jumps there), a folder in Finder.
set -g @fingers-pattern-2 '[\w.~/-]*\w\.\w+:\d+(?::\d+)?'
set -g @fingers-alt-action '/Users/michaelbrandt/.config/tmux/fingers-edit.sh'

# Copy on mouse-drag release and immediately exit copy-mode (clears the highlight)
set -g @yank_action 'copy-pipe-and-cancel'

##### --- Status Line ---
# Only palette names (yellow, brightblack, default), so Ghostty's light/dark switch recolors tmux too.
# Two lines at the bottom: a rule parts Claude's input box from the window list.
# The rule is 500 padded spaces turned into ─; tmux cuts it to the terminal width.
set -g status 2
set -g status-position bottom
set -g status-format[0] '#[fg=brightblack]#{s/ /─/:#{p500:}}'
set -g status-format[1] '#[align=left]#{T:status-left}#[list=on]#{W:#[range=window|#{window_index}]#{T:window-status-format}#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus]#{T:window-status-current-format}#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist align=right]#{T:status-right}'
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=default,fg=default"
set -g message-style "bg=default,fg=default"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=brightblack"
set -g status-left ""
# The dev-server light is a clickable range: clicking it opens server-menu.sh --info.
set -g status-right "#[range=user|server]#(~/.config/tmux/server-status.sh)#[norange] #[fg=brightblack]#(~/.config/tmux/pueue-status.sh)"
set -g status-right-length 40
# Clicks on the status line select the window as usual, except on the server light.
bind-key -n MouseDown1Status if-shell -F '#{==:#{mouse_status_range},server}' {
  run-shell -b "~/.config/tmux/server-menu.sh --info '#{?@claude_worktree,#{@claude_worktree},#{pane_current_path}}' '#{client_name}'"
} {
  select-window -t =
}
set -g window-status-separator " "
set -g window-status-style default
set -g window-status-current-style default

# Claude Code state colors the name; set per window by ~/.config/claude/hooks/tmux-claude-flag.sh.
# The color means it's your turn: yellow = Claude finished, red = permission prompt.
# It stays until you reply; everything else (working, not Claude) is grey.
set -g @tab_color '#{?#{==:#{@claude_state},ready},yellow bold,#{?#{==:#{@claude_state},blocked},red bold,brightblack}}'
# Each name gets an equal share of the width, never under 8 characters.
set -g @tab_width '#{e|-:#{e|/:#{client_width},#{session_windows}},8}'
set -g @tab_name '#{=/#{?#{e|<:#{E:@tab_width},8},8,#{E:@tab_width}}/…:window_name}'
# Same width in both formats (pads vs round caps), so tabs don't shift when you switch.
set -g window-status-format ' #[fg=brightblack] #I #[fg=#{E:@tab_color}]#{E:@tab_name}  '
set -g window-status-current-format '#[fg=default]#[reverse,bold] #I #{E:@tab_name} #[noreverse,nobold]'
set-hook -gu after-select-window

# Claude Code panes: their command is the version ("2.1.329"), so name the window
# from the pane title Claude sets ("✳ <topic>"), minus the status glyph.
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},#{s/^[^ ]+ //:pane_title},#{pane_current_command}}}#{?pane_dead,[dead],}'

##### --- Initialize TPM (keep last) ---
# Plugins must load after status-right is set: tmux-continuum appends its
# autosave hook to status-right, and a later `set status-right` erases it.
run ~/.config/tmux/plugins/tpm/tpm
