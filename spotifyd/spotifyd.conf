# spotifyd — persistent Spotify Connect backend for spotatui (remote mode)
# Auth: run `spotifyd authenticate` once (OAuth); credentials are cached below.
# Backend (portaudio) is supplied by the `brew services` launcher.
[global]
device_name = "spotifyd"
device_type = "computer"
bitrate = 320
cache_path = "/Users/michaelbrandt/.cache/spotifyd"
volume_normalisation = true
# discovery stays on so a phone/desktop can also hand off to this device
